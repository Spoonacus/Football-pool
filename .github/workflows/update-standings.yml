name: Update Leaderboard

on:
  workflow_dispatch:
  push:
    paths:
      - '**.xlsx'
      - '**.xls'
      - 'grade_picks.py'
  schedule:
    # Runs every 10 minutes on Thursdays, Sundays, and Mondays (UTC)
    - cron: '*/10 0-5,16-23 * * 0,1,4'

permissions:
  contents: write

jobs:
  grade-picks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: pip install pandas openpyxl requests

      - name: Run Grading Script
        run: python grade_picks.py

      - name: Save and Commit Standings
        run: |
          git config --global user.name "NFL-Bot"
          git config --global user.email "bot@nflpool.local"
          git add standings.json index.html
          git commit -m "Auto-updated standings [skip ci]" || echo "No changes to commit"
          git push
          
