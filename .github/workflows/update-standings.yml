name: Update Leaderboard

on:
  workflow_dispatch:
  push:
    paths:
      - '**.xlsx'
      - '**.xls'
      - 'grade_picks.py'
  schedule:
    # Runs every 10 mins on Sun, Mon, Tue, Thu, Fri (UTC) to cover all night games
    - cron: '*/10 0-6,16-23 * * 0,1,2,4,5'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: pip install pandas openpyxl requests

      - name: Run Grading Script
        run: python grade_picks.py

      - name: Package Website
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to Live Website
        id: deployment
        uses: actions/deploy-pages@v4
