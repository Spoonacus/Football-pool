name: Update Leaderboard

# This tells GitHub to run the script whenever you upload a new Excel file
on:
  push:
    paths:
      - '**.xlsx'
      - '**.xls'

# Gives the script permission to save the JSON file back to the repository
permissions:
  contents: write

jobs:
  grade-picks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: pip install pandas openpyxl requests

      - name: Run Grading Script
        run: python grade_picks.py

      - name: Save and Commit Standings
        run: |
          git config --global user.name "NFL-Bot"
          git config --global user.email "bot@nflpool.local"
          git add standings.json
          git commit -m "Auto-updated standings" || echo "No changes to commit"
          git push
          
