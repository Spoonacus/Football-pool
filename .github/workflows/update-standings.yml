name: Update Leaderboard

on:
  workflow_dispatch:
  push:
    paths:
      - '**.xlsx'
      - '**.xls'
      - 'grade_picks.py'
  schedule:
    - cron: '*/10 0-5,16-23 * * 0,1,4'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: pip install pandas openpyxl requests

      - name: Run Grading Script
        run: python grade_picks.py

      - name: Save Backup to Repository
        run: |
          git config --global user.name "NFL-Bot"
          git config --global user.email "bot@nflpool.local"
          git add index.html
          git commit -m "Auto-update standings" || true
          git pull --rebase origin main || true
          git push || true

      - name: Package Website
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to Live Website
        id: deployment
        uses: actions/deploy-pages@v4
