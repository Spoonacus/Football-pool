<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL Pool Leaderboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200 text-gray-900 p-4 font-sans flex justify-center mt-6">
    
    <div class="w-full max-w-md bg-white rounded-xl shadow-lg overflow-hidden">
        
        <div class="bg-green-700 text-white p-6 text-center relative overflow-hidden">
            <h1 class="text-3xl font-bold">NFL Pick'em</h1>
            <p id="week-title" class="text-green-200 mt-1 mb-4">Loading week...</p>
            
            <!-- Updated Leader Banner for Ties -->
            <div id="first-place-banner" class="bg-green-800 rounded-lg p-3 shadow-inner hidden border border-green-600">
                <p id="leader-header" class="text-xs text-green-300 uppercase tracking-widest font-bold">Current Leader</p>
                <div id="leader-name" class="text-xl font-black text-yellow-400 mt-2 mb-1 leading-snug">--</div>
                <p class="text-sm font-semibold mt-1 text-green-100" id="leader-score">-- Wins</p>
            </div>
        </div>
        
        <div class="p-4">
            <table class="w-full text-left">
                <thead>
                    <tr class="text-gray-500 border-b-2 border-gray-200 text-sm">
                        <th class="py-2 font-semibold w-12">Rank</th>
                        <th class="py-2 font-semibold">Player</th>
                        <th class="py-2 font-semibold text-center w-16">Wins</th>
                        <th class="py-2 font-semibold text-right w-16">TB</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <tr>
                        <td colspan="4" class="text-center py-6 text-gray-500 animate-pulse">
                            Loading standings...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
    </div>

    <script>
        async function loadStandings() {
            try {
                const response = await fetch('standings.json?t=' + new Date().getTime());
                
                if (!response.ok) throw new Error("Data not found");
                const data = await response.json();
                
                document.getElementById('week-title').innerText = data.week + ' Standings';
                const tbody = document.getElementById('leaderboard-body');
                tbody.innerHTML = ''; 
                
                if (data.standings.length > 0) {
                    const topScore = data.standings[0].score;
                    
                    // Filter everyone who shares the highest score
                    const leaders = data.standings.filter(player => player.score === topScore);
                    
                    document.getElementById('first-place-banner').classList.remove('hidden');
                    document.getElementById('leader-score').innerText = topScore + ' Correct Picks';
                    
                    const nameContainer = document.getElementById('leader-name');
                    const header = document.getElementById('leader-header');
                    
                    // Display differently if there is a tie
                    if (leaders.length > 1) {
                        header.innerText = 'TIED FOR 1ST PLACE';
                        nameContainer.innerHTML = leaders.map(l => 
                            `${l.name} <span class="text-sm font-normal text-green-200 ml-1">(TB: ${l.tie_breaker})</span>`
                        ).join('<br>');
                    } else {
                        header.innerText = 'CURRENT LEADER';
                        nameContainer.innerHTML = `${leaders[0].name} <span class="text-sm font-normal text-green-200 ml-1">(TB: ${leaders[0].tie_breaker})</span>`;
                    }
                }
                
                data.standings.forEach(player => {
                    const tr = document.createElement('tr');
                    tr.className = "border-b border-gray-100 hover:bg-gray-50";
                    
                    tr.innerHTML = `
                        <td class="py-3 font-bold text-lg text-gray-700">${player.rank}</td>
                        <td class="py-3 font-semibold text-gray-800">${player.name}</td>
                        <td class="py-3 font-bold text-center text-green-600">${player.score}</td>
                        <td class="py-3 font-medium text-right text-gray-400">${player.tie_breaker}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                document.getElementById('leaderboard-body').innerHTML = 
                    `<tr><td colspan="4" class="text-center py-4 text-red-500">Waiting for data...</td></tr>`;
            }
        }
        
        window.onload = loadStandings;
    </script>
</body>
</html>
