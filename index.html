<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL Pool Leaderboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200 text-gray-900 p-3 font-sans flex justify-center mt-4">
    
    <div class="w-full max-w-md bg-white rounded-xl shadow-lg overflow-hidden">
        
        <div class="bg-green-700 text-white p-5 text-center relative overflow-hidden">
            <h1 class="text-3xl font-bold">NFL Pick'em</h1>
            <p id="week-title" class="text-green-200 mt-1 mb-3">Loading week...</p>
            
            <div id="first-place-banner" class="bg-green-800 rounded-lg p-3 shadow-inner hidden border border-green-600">
                <p id="leader-header" class="text-xs text-green-300 uppercase tracking-widest font-bold">Current Leader</p>
                <div id="leader-name" class="text-xl font-black text-yellow-400 mt-1 mb-1 leading-snug">--</div>
                <p class="text-sm font-semibold text-green-100" id="leader-score">-- Wins</p>
            </div>
        </div>
        
        <div class="p-3">
            <div class="flex justify-between items-center mb-2 px-2">
                <p class="text-xs text-gray-400 italic">Tap any player to view their picks</p>
                <button id="toggle-all-btn" onclick="toggleAll()" class="text-xs font-bold text-green-600 bg-green-50 px-3 py-1.5 rounded border border-green-200 active:bg-green-100">Expand All</button>
            </div>
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="text-gray-500 border-b-2 border-gray-200 text-sm">
                        <th class="py-2 pl-2 font-semibold w-10">Rank</th>
                        <th class="py-2 font-semibold">Player</th>
                        <th class="py-2 font-semibold text-center w-14">Wins</th>
                        <th class="py-2 pr-2 font-semibold text-right w-12">TB</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <tr>
                        <td colspan="4" class="text-center py-6 text-gray-500 animate-pulse">
                            Loading standings...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
    </div>

    <script>
        let allExpanded = false;

        function togglePicks(idx) {
            const drawer = document.getElementById('picks-' + idx);
            const icon = document.getElementById('chevron-' + idx);
            if (drawer) {
                if (drawer.classList.contains('hidden')) {
                    drawer.classList.remove('hidden');
                    icon.classList.add('rotate-90');
                } else {
                    drawer.classList.add('hidden');
                    icon.classList.remove('rotate-90');
                }
            }
        }

        function toggleAll() {
            allExpanded = !allExpanded;
            const btn = document.getElementById('toggle-all-btn');
            btn.innerText = allExpanded ? 'Collapse All' : 'Expand All';
            
            document.querySelectorAll('[id^="picks-"]').forEach(drawer => {
                if (allExpanded) drawer.classList.remove('hidden');
                else drawer.classList.add('hidden');
            });
            
            document.querySelectorAll('[id^="chevron-"]').forEach(icon => {
                if (allExpanded) icon.classList.add('rotate-90');
                else icon.classList.remove('rotate-90');
            });
        }

        async function loadStandings() {
            try {
                const response = await fetch('standings.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error("Data not found");
                const data = await response.json();
                
                document.getElementById('week-title').innerText = data.week + ' Standings';
                const tbody = document.getElementById('leaderboard-body');
                tbody.innerHTML = ''; 
                
                if (data.standings.length > 0) {
                    const topScore = data.standings[0].score;
                    const leaders = data.standings.filter(player => player.score === topScore);
                    
                    document.getElementById('first-place-banner').classList.remove('hidden');
                    document.getElementById('leader-score').innerText = topScore + ' Correct Picks';
                    
                    const nameContainer = document.getElementById('leader-name');
                    const header = document.getElementById('leader-header');
                    
                    if (leaders.length > 1) {
                        header.innerText = 'TIED FOR 1ST PLACE';
                        nameContainer.innerHTML = leaders.map(l => 
                            `${l.name} <span class="text-sm font-normal text-green-200">(TB: ${l.tie_breaker})</span>`
                        ).join('<br>');
                    } else {
                        header.innerText = 'CURRENT LEADER';
                        nameContainer.innerHTML = `${leaders[0].name} <span class="text-sm font-normal text-green-200">(TB: ${leaders[0].tie_breaker})</span>`;
                    }
                }
                
                data.standings.forEach((player, idx) => {
                    const rowId = 'picks-' + idx;
                    const chevronId = 'chevron-' + idx;
                    
                    const tr = document.createElement('tr');
                    tr.className = "border-b border-gray-100 hover:bg-gray-50 cursor-pointer transition select-none active:bg-gray-100";
                    tr.onclick = () => togglePicks(idx);
                    
                    tr.innerHTML = `
                        <td class="py-3 pl-2 font-bold text-base text-gray-700">${player.rank}</td>
                        <td class="py-3 font-semibold text-gray-800 flex items-center gap-2">
                            <svg id="${chevronId}" class="w-4 h-4 text-gray-400 transition-transform duration-200 transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
                            <span>${player.name}</span>
                        </td>
                        <td class="py-3 font-bold text-center text-green-600">${player.score}</td>
                        <td class="py-3 pr-2 font-medium text-right text-gray-400 text-sm">${player.tie_breaker}</td>
                    `;
                    tbody.appendChild(tr);

                    const drawerRow = document.createElement('tr');
                    drawerRow.id = rowId;
                    drawerRow.className = "hidden bg-gray-50 border-b border-gray-200 shadow-inner";

                    const pickBadges = (player.picks || []).map(p => {
                        const bg = p.correct ? 'bg-green-100 text-green-800 border-green-300' : 'bg-red-50 text-red-600 border-red-200 line-through opacity-70';
                        return `<span class="inline-block text-xs font-semibold px-2 py-0.5 rounded border ${bg}">${p.team}</span>`;
                    }).join('');

                    drawerRow.innerHTML = `
                        <td colspan="4" class="p-3">
                            <div class="flex flex-wrap gap-1.5">
                                ${pickBadges || '<span class="text-xs text-gray-400">No individual picks recorded</span>'}
                            </div>
                        </td>
                    `;
                    tbody.appendChild(drawerRow);
                });
            } catch (error) {
                document.getElementById('leaderboard-body').innerHTML = 
                    `<tr><td colspan="4" class="text-center py-4 text-red-500">Waiting for data...</td></tr>`;
            }
        }
        
        window.onload = loadStandings;
    </script>
</body>
</html>
