<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit NFL Picks</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200 text-gray-900 p-3 font-sans flex justify-center mt-2 mb-10">

    <div class="w-full max-w-md bg-white rounded-xl shadow-lg overflow-hidden">
        
        <!-- Header -->
        <div class="bg-green-700 text-white p-5 text-center">
            <h1 class="text-3xl font-bold">NFL Pick'em</h1>
            <p id="week-header" class="text-green-200 mt-1 font-semibold">Loading current week...</p>
            <a href="index.html" class="inline-block mt-2 text-xs text-green-100 underline hover:text-white">← Back to Standings</a>
        </div>

        <form id="picks-form" class="p-4 space-y-5">
            
            <!-- Player Info -->
            <div class="bg-gray-50 p-3 rounded-lg border border-gray-200 space-y-3">
                <div>
                    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Your Name</label>
                    <input type="text" id="player-name" required placeholder="e.g., Spoonacus"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Your Email</label>
                    <input type="email" id="player-email" required placeholder="you@example.com"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600">
                </div>
            </div>

            <!-- Matchups List -->
            <div id="matchups-container" class="space-y-3">
                <p class="text-center text-gray-500 py-6 animate-pulse">Loading matchups...</p>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submit-btn" disabled
                class="w-full bg-green-700 hover:bg-green-800 disabled:bg-gray-400 text-white font-bold py-3.5 rounded-xl shadow-md transition text-lg">
                Submit Picks
            </button>

            <p id="status-msg" class="text-center text-sm font-semibold hidden"></p>
        </form>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby2Q8ipOv-Hl3_mXRB2DDEU4oQ4hu3vA0aiwS2m_ts6QrnUPtR7TMyxvnjVH5eyltzk6A/exec";

        let currentWeekNum = 1;
        let matchupsData = [];
        let userPicks = {};

        // Default aliases (merged with team_aliases.json from GitHub on load)
        const ALIASES = {
            "bucs": "buccaneers",
            "commanskins": "commanders",
            "redskins": "commanders",
            "niners": "49ers",
            "pats": "patriots",
            "jags": "jaguars",
            "cards": "cardinals",
            "hawks": "seahawks",
            "fins": "dolphins",
            "bolts": "chargers"
        };

        function normalizeTeam(name) {
            const clean = String(name || "").toLowerCase().replace(/[^a-z0-9]/g, "");
            return ALIASES[clean] || clean;
        }

        function findEspnTeam(espnEvents, teamLabel) {
            const target = normalizeTeam(teamLabel);
            for (const event of espnEvents) {
                const comp = event.competitions[0];
                for (const c of comp.competitors) {
                    const candidates = [
                        c.team.shortDisplayName,
                        c.team.name,
                        c.team.displayName,
                        c.team.abbreviation
                    ].map(normalizeTeam);
                    if (candidates.some(cand => cand && (cand.includes(target) || target.includes(cand)))) {
                        return { team: c.team, eventDate: event.date };
                    }
                }
            }
            return null;
        }

        async function loadMatchups() {
            const container = document.getElementById('matchups-container');
            try {
                // 0. Load custom team aliases saved via admin.html
                try {
                    const aliasRes = await fetch(`./team_aliases.json?t=${Date.now()}`);
                    if (aliasRes.ok) Object.assign(ALIASES, await aliasRes.json());
                } catch (e) {}

                // 1. Try loading uncle's exact matchup order from GitHub
                let templateJson = null;
                try {
                    const jsonRes = await fetch(`./current_matchups.json?t=${Date.now()}`);
                    if (jsonRes.ok) {
                        const parsed = await jsonRes.json();
                        if (parsed && Array.isArray(parsed.matchups) && parsed.matchups.length > 0) {
                            templateJson = parsed;
                        }
                    }
                } catch (e) {
                    console.log("No current_matchups.json found, falling back to ESPN.");
                }

                // 2. Fetch ESPN scoreboard for logos & kickoff times
                const espnUrl = templateJson
                    ? `https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?week=${templateJson.week}`
                    : `https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard`;
                const espnRes = await fetch(espnUrl);
                const espnData = await espnRes.json();
                const espnEvents = espnData.events || [];

                let gamesToRender = [];

                if (templateJson) {
                    currentWeekNum = templateJson.week;
                    gamesToRender = templateJson.matchups.map(m => {
                        const awayMatch = findEspnTeam(espnEvents, m.away);
                        const homeMatch = findEspnTeam(espnEvents, m.home);
                        const eventDate = (awayMatch && awayMatch.eventDate) || (homeMatch && homeMatch.eventDate) || null;
                        return {
                            away: m.away,
                            home: m.home,
                            awayLogo: awayMatch ? awayMatch.team.logo : "",
                            homeLogo: homeMatch ? homeMatch.team.logo : "",
                            gameTime: eventDate
                                ? new Date(eventDate).toLocaleString([], {
                                    weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
                                  })
                                : ""
                        };
                    });
                } else {
                    currentWeekNum = espnData.week.number;
                    const sortedEvents = espnEvents.sort((a, b) => new Date(a.date) - new Date(b.date));
                    gamesToRender = sortedEvents.map(event => {
                        const comp = event.competitions[0];
                        const away = comp.competitors.find(c => c.homeAway === 'away');
                        const home = comp.competitors.find(c => c.homeAway === 'home');
                        return {
                            away: away.team.shortDisplayName || away.team.name,
                            home: home.team.shortDisplayName || home.team.name,
                            awayLogo: away.team.logo,
                            homeLogo: home.team.logo,
                            gameTime: new Date(event.date).toLocaleString([], {
                                weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
                            })
                        };
                    });
                }

                document.getElementById('week-header').innerText = `NFL Week ${currentWeekNum} Picks`;
                container.innerHTML = '';
                matchupsData = [];

                gamesToRender.forEach((game, idx) => {
                    matchupsData.push({ away: game.away, home: game.home });
                    const isLastGame = (idx === gamesToRender.length - 1);
                    const safeAway = game.away.replace(/'/g, "\\'");
                    const safeHome = game.home.replace(/'/g, "\\'");

                    const card = document.createElement('div');
                    card.className = "border border-gray-200 rounded-xl p-3 bg-white shadow-sm";
                    card.innerHTML = `
                        <div class="flex justify-between items-center text-xs text-gray-400 font-semibold mb-2">
                            <span>Game ${idx + 1} ${isLastGame ? '• Tie Breaker Game' : ''}</span>
                            <span>${game.gameTime}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <button type="button" id="btn-${idx}-away" onclick="selectTeam(${idx}, '${safeAway}', 'away')"
                                class="pick-btn-${idx} flex flex-col items-center justify-center p-3 rounded-lg border-2 border-gray-200 hover:bg-gray-50 transition">
                                ${game.awayLogo ? `<img src="${game.awayLogo}" alt="${game.away}" class="w-12 h-12 object-contain mb-1">` : ''}
                                <span class="font-bold text-sm text-gray-800">${game.away}</span>
                            </button>
                            <button type="button" id="btn-${idx}-home" onclick="selectTeam(${idx}, '${safeHome}', 'home')"
                                class="pick-btn-${idx} flex flex-col items-center justify-center p-3 rounded-lg border-2 border-gray-200 hover:bg-gray-50 transition">
                                ${game.homeLogo ? `<img src="${game.homeLogo}" alt="${game.home}" class="w-12 h-12 object-contain mb-1">` : ''}
                                <span class="font-bold text-sm text-gray-800">${game.home}</span>
                            </button>
                        </div>
                        ${isLastGame ? `
                        <div class="mt-3 pt-3 border-t border-gray-100">
                            <label class="block text-xs font-bold text-green-700 uppercase mb-1">
                                Tie Breaker (Total Combined Points)
                            </label>
                            <input type="number" id="tie-breaker" required min="0" step="1" inputmode="numeric"
                                placeholder="Enter whole number (e.g., 45)"
                                oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                                class="w-full px-3 py-2 border border-green-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-600 font-bold text-center text-lg">
                        </div>` : ''}
                    `;
                    container.appendChild(card);
                });

                document.getElementById('submit-btn').disabled = false;
            } catch (err) {
                container.innerHTML = `<p class="text-center text-red-500 py-4">Failed to load matchups. Please refresh.</p>`;
            }
        }

        function selectTeam(gameIdx, teamName, side) {
            userPicks[gameIdx] = teamName;

            document.querySelectorAll(`.pick-btn-${gameIdx}`).forEach(btn => {
                btn.classList.remove('border-green-600', 'bg-green-50', 'ring-2', 'ring-green-500');
                btn.classList.add('border-gray-200');
            });

            const selectedBtn = document.getElementById(`btn-${gameIdx}-${side}`);
            selectedBtn.classList.remove('border-gray-200');
            selectedBtn.classList.add('border-green-600', 'bg-green-50', 'ring-2', 'ring-green-500');
        }

        document.getElementById('picks-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusMsg = document.getElementById('status-msg');
            const submitBtn = document.getElementById('submit-btn');

            if (Object.keys(userPicks).length < matchupsData.length) {
                statusMsg.innerText = `Please pick a winner for all ${matchupsData.length} games!`;
                statusMsg.className = "text-center text-sm font-semibold text-red-600 block";
                return;
            }

            const payload = {
                week: currentWeekNum,
                name: document.getElementById('player-name').value.trim(),
                email: document.getElementById('player-email').value.trim(),
                tieBreaker: parseInt(document.getElementById('tie-breaker').value, 10),
                matchups: matchupsData,
                picks: userPicks
            };

            submitBtn.disabled = true;
            submitBtn.innerText = "Sending Picks...";
            statusMsg.classList.add('hidden');

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                statusMsg.innerText = "Picks submitted! Your sheet has been emailed.";
                statusMsg.className = "text-center text-sm font-bold text-green-700 block";
                submitBtn.innerText = "Submitted ✓";
            } catch (err) {
                statusMsg.innerText = "Error: " + err.message;
                statusMsg.className = "text-center text-sm font-semibold text-red-600 block";
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Picks";
            }
        });

        window.onload = loadMatchups;
    </script>
</body>
</html>
